name: Skill and receipt controls
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic installer and independent-receipt controls (no Stata)
        run: python -B -m unittest discover -s tests -v
